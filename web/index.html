<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaMeL Chat Proxy · 管理面板</title>
<style>
:root{
  --bg:#faf3ea; --bg2:#f3e9dc; --card:#fffdf9; --ink:#4a3826; --ink2:#8a7157;
  --primary:#c98a5e; --primary-d:#b06f42; --accent:#e0a96d;
  --ok:#3d8b5f; --warn:#c98a2d; --bad:#c2554a; --line:#e8d9c6;
  --radius:14px; --shadow:0 2px 10px rgba(90,60,20,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:var(--ink);min-height:100vh}
header{background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;height:60px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--primary-d);white-space:nowrap}
.logo .cam{font-size:22px}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav button{background:none;border:none;padding:8px 14px;border-radius:10px;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav button:hover{background:var(--bg);color:var(--primary-d)}
nav button.active{background:var(--primary);color:#fff}
.user-area{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:13px}
main{max-width:1100px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin-bottom:14px;color:var(--primary-d);display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .num{font-size:26px;font-weight:700;color:var(--primary-d)}
.stat .lbl{font-size:12px;color:var(--ink2);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 10px;color:var(--ink2);font-weight:600;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fffaf2}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.b-ok{background:#e4f3ea;color:var(--ok)} .b-bad{background:#fae6e2;color:var(--bad)} .b-warn{background:#faf0dc;color:var(--warn)}
button.btn{background:var(--primary);color:#fff;border:none;padding:7px 14px;border-radius:9px;font-size:13px;cursor:pointer;transition:.15s}
button.btn:hover{background:var(--primary-d)}
button.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
button.btn.ghost{background:none;color:var(--primary-d);border:1px solid var(--primary);}
button.btn.ghost:hover{background:#fdf1e3}
button.btn.danger{background:var(--bad)} button.btn.danger:hover{background:#a94338}
button.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fffdf9;color:var(--ink);font-family:inherit}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.5;resize:vertical}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.form-row>*{flex:1;min-width:150px}
.muted{color:var(--ink2);font-size:12px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3d2f1f;color:#fff;padding:10px 22px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:80vw}
#toast.show{opacity:.95}
#loginScreen{max-width:380px;margin:12vh auto;padding:30px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
#loginScreen h1{font-size:20px;color:var(--primary-d);margin-bottom:6px}
#loginScreen p{color:var(--ink2);font-size:13px;margin-bottom:18px}
.hidden{display:none}
.empty{padding:30px;text-align:center;color:var(--ink2);font-size:13px}
#logsBox{background:#2b2118;color:#e8d9c6;border-radius:12px;padding:14px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.7;height:440px;overflow:auto}
#logsBox .lwarn{color:#f0c36d} #logsBox .lerr{color:#f08a7a}
.model-tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin:4px;font-size:12px}
.model-tag b{color:var(--primary-d)}
.model-tag .ctx{color:var(--ink2);font-size:11px}
@media(max-width:640px){main{padding:0 8px}header{height:auto;flex-wrap:wrap;padding:10px}nav{order:3;width:100%}nav button{flex:1}}
</style>
</head>
<body>

<div id="loginScreen">
  <h1>🐪 CaMeL Chat Proxy</h1>
  <p>管理面板 · 请输入管理员密码</p>
  <input type="password" id="pwd" placeholder="admin password" style="margin-bottom:12px">
  <button class="btn" style="width:100%" onclick="doLogin()">进入面板</button>
</div>

<div id="app" class="hidden">
<header>
  <div class="logo"><span class="cam">🐪</span> CaMeL Proxy</div>
  <nav>
    <button data-tab="dashboard" class="active" onclick="showTab('dashboard')">总览</button>
    <button data-tab="accounts" onclick="showTab('accounts')">账号</button>
    <button data-tab="config" onclick="showTab('config')">配置</button>
    <button data-tab="models" onclick="showTab('models')">模型</button>
    <button data-tab="logs" onclick="showTab('logs')">日志</button>
  </nav>
  <div class="user-area"><span id="statusDot" style="width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block"></span><span id="healthText">…</span></div>
</header>

<main>
  <!-- 总览 -->
  <section id="tab-dashboard">
    <div class="grid" id="statCards"></div>
    <div class="card"><h2>📡 服务健康</h2><div id="healthDetail" class="muted">加载中…</div></div>
    <div class="card">
      <h2>⚡ 快捷操作</h2>
      <div class="form-row">
        <button class="btn" onclick="refreshModels()">刷新模型缓存</button>
        <button class="btn ghost" onclick="testAccounts()">测试全部账号</button>
        <button class="btn ghost" onclick="refreshCookies()">刷新全部 Cookie</button>
        <button class="btn ghost" onclick="loadUsage()">查看用量</button>
      </div>
      <div id="usageBox" style="margin-top:14px"></div>
    </div>
  </section>

  <!-- 账号 -->
  <section id="tab-accounts" class="hidden">
    <div class="card">
      <h2>➕ 添加账号</h2>
      <div class="form-row">
        <input type="text" id="newEmail" placeholder="邮箱">
        <input type="password" id="newPwd" placeholder="密码">
        <button class="btn" onclick="addAccount()">添加</button>
      </div>
    </div>
    <div class="card">
      <h2>👥 账号列表</h2>
      <table>
        <thead><tr><th>邮箱</th><th>状态</th><th>登录时间</th><th>最近测试</th><th style="width:220px">操作</th></tr></thead>
        <tbody id="accountsBody"></tbody>
      </table>
    </div>
  </section>

  <!-- 配置 -->
  <section id="tab-config" class="hidden">
    <div class="card">
      <h2>⚙️ 配置 (config.json)</h2>
      <p class="muted" style="margin-bottom:12px">直接编辑 JSON，保存后立即生效。账号密码字段会以明文写入 config.json。</p>
      <textarea id="configJson" rows="18" spellcheck="false"></textarea>
      <div class="form-row" style="margin-top:14px">
        <button class="btn" onclick="saveConfig()">💾 保存配置</button>
        <button class="btn ghost" onclick="reloadConfig()">重新加载</button>
      </div>
    </div>
  </section>

  <!-- 模型 -->
  <section id="tab-models" class="hidden">
    <div class="card">
      <h2>🤖 可用模型 <span class="muted" id="modelCount"></span></h2>
      <div class="form-row" style="margin-bottom:12px">
        <button class="btn" onclick="refreshModels()">刷新模型缓存</button>
      </div>
      <div id="modelsBox"></div>
    </div>
  </section>

  <!-- 日志 -->
  <section id="tab-logs" class="hidden">
    <div class="card">
      <h2>📜 实时日志</h2>
      <div class="form-row" style="margin-bottom:12px">
        <button class="btn sm" id="logPauseBtn" onclick="toggleLogPause()">⏸ 暂停</button>
        <button class="btn sm ghost" onclick="clearLogs()">清屏</button>
        <span class="muted">自动刷新 3s · 仅保留最近 300 条</span>
      </div>
      <div id="logsBox"></div>
    </div>
  </section>
</main>
</div>

<div id="toast"></div>

<script>
const PWD_KEY = "camel_admin_pwd";
let PWD = sessionStorage.getItem(PWD_KEY) || "";
let logTimer = null, logPaused = false;

/* ---------- 工具 ---------- */
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
async function api(path, method="GET", body=null){
  const opts={method,headers:{"x-admin-password":PWD}};
  if(body!==null){opts.headers["Content-Type"]="application/json";opts.body=JSON.stringify(body);}
  const r=await fetch(path,opts);
  let data=null;try{data=await r.json();}catch(e){data={error:String(r.status)};}
  if(r.status===401||r.status===403){document.getElementById("app").classList.add("hidden");document.getElementById("loginScreen").classList.remove("hidden");toast("密码错误或已失效，请重新登录");return null;}
  if(!r.ok){toast((data&&(data.detail||data.error))||("请求失败 "+r.status));return null;}
  return data;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---------- 登录 ---------- */
function doLogin(){
  PWD=document.getElementById("pwd").value.trim();
  if(!PWD){toast("请输入密码");return;}
  sessionStorage.setItem(PWD_KEY,PWD);
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  showTab("dashboard");
  toast("欢迎回来，主人~ 🐪");
}

/* ---------- Tab ---------- */
function showTab(name){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
  ["dashboard","accounts","config","models","logs"].forEach(t=>document.getElementById("tab-"+t).classList.toggle("hidden",t!==name));
  if(name==="dashboard")loadDashboard();
  if(name==="accounts")loadAccounts();
  if(name==="config")loadConfig();
  if(name==="models")loadModels();
  if(name==="logs")startLogs();
}
function badge(ok){return ok?'<span class="badge b-ok">✓ 可用</span>':'<span class="badge b-bad">✗ 失效</span>';}

/* ---------- 总览 ---------- */
async function loadDashboard(){
  const h=await api("/health");
  if(!h)return;
  const accounts=h.accounts||[];
  const okN=accounts.filter(a=>a.is_valid).length;
  document.getElementById("statCards").innerHTML=[
    {n:accounts.length,l:"账号总数"},
    {n:okN,l:"可用账号"},
    {n:h.model_count??"–",l:"缓存模型"},
    {n:h.models_cached?"已缓存":"未缓存",l:"模型缓存状态"}
  ].map(s=>`<div class="stat"><div class="num">${s.n}</div><div class="lbl">${s.l}</div></div>`).join("");
  const lines=accounts.map(a=>`<div>${esc(a.email)} · ${badge(a.is_valid)} · Cookie:${a.cookie_ready?"就绪":"未就绪"} · 登录:${esc(a.login_time||"—")}</div>`).join("")||'<div class="muted">暂无账号</div>';
  document.getElementById("healthDetail").innerHTML=`<div style="margin-bottom:6px">服务状态：<span class="badge b-ok">运行中</span></div>${lines}`;
}
async function testAccounts(){toast("正在测试全部账号…");const d=await api("/admin/test-accounts","POST");if(d){toast("测试完成");loadDashboard();}}
async function refreshCookies(){toast("正在刷新全部 Cookie…");const d=await api("/admin/refresh-cookies","POST");if(d){toast("刷新完成");loadDashboard();}}
async function loadUsage(){
  const d=await api("/admin/usage");
  if(!d)return;
  const box=document.getElementById("usageBox");
  const rows=(d.accounts||[]).map(a=>{
    const u=a.usage||{};const s=a.search||{};
    const boost=u.boost||{};
    return `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(a.email)}</b> · 等级 ${esc((u.tier&&u.tier.name)||"—")} · 周用量 ${u.weeklyCapPercent??"—"}% · 联网 ${s.used??"—"}/${s.limit??"—"} · Boost ${boost.boostsRemaining??"—"}/${boost.boostLimit??"—"} ${a.error?'<span class="badge b-bad">'+esc(a.error)+'</span>':""}</div>`;
  }).join("")||'<div class="muted">暂无数据</div>';
  box.innerHTML="<h3 style='font-size:14px;margin-bottom:6px'>📊 用量（30 分钟缓存）</h3>"+rows;
}

/* ---------- 账号 ---------- */
async function loadAccounts(){
  const d=await api("/admin/config");
  if(!d)return;
  const rows=(d.camel_accounts||[]).map(a=>`
    <tr>
      <td class="mono">${esc(a.email)}</td>
      <td>${badge(a.is_valid)}</td>
      <td>${esc(a.login_time||"—")}</td>
      <td>${esc(a.last_test||"—")}</td>
      <td>
        <button class="btn sm" onclick="loginOne('${esc(a.email)}')">登录</button>
        <button class="btn sm ghost" onclick="testOne('${esc(a.email)}')">测试</button>
        <button class="btn sm danger" onclick="deleteAccount('${esc(a.email)}')">删除</button>
      </td>
    </tr>`).join("");
  document.getElementById("accountsBody").innerHTML=rows||'<tr><td colspan="5" class="empty">暂无账号，请在上方添加</td></tr>';
}
async function loginOne(email){toast("正在登录 "+email+"…");const d=await api("/admin/login","POST",{email});if(d)toast(d.status==="ok"?"登录成功":"登录失败");loadAccounts();}
async function testOne(email){toast("测试中…");await api("/admin/test-accounts","POST");loadAccounts();}
async function addAccount(){
  const email=document.getElementById("newEmail").value.trim();
  const password=document.getElementById("newPwd").value;
  if(!email||!password){toast("请填写邮箱和密码");return;}
  const d=await api("/admin/config");
  if(!d)return;
  const list=d.camel_accounts||[];
  if(list.some(a=>a.email===email)){toast("该账号已存在");return;}
  list.push({email,password,is_valid:false,login_time:"",last_test:""});
  const r=await api("/admin/config","POST",{camel_accounts:list});
  if(r){toast("已添加 "+email);document.getElementById("newEmail").value="";document.getElementById("newPwd").value="";loadAccounts();}
}
async function deleteAccount(email){
  if(!confirm("确定删除账号 "+email+" ？"))return;
  const d=await api("/admin/config");
  if(!d)return;
  const list=(d.camel_accounts||[]).filter(a=>a.email!==email);
  const r=await api("/admin/config","POST",{camel_accounts:list});
  if(r){toast("已删除 "+email);loadAccounts();}
}

/* ---------- 配置 ---------- */
async function loadConfig(){
  const d=await api("/admin/config");
  if(!d)return;
  document.getElementById("configJson").value=JSON.stringify(d,null,2);
}
async function saveConfig(){
  let obj=null;
  try{obj=JSON.parse(document.getElementById("configJson").value);}catch(e){toast("JSON 解析失败："+e.message);return;}
  const r=await api("/admin/config","POST",obj);
  if(r){toast("配置已保存并生效");loadConfig();loadAccounts();}
}
async function reloadConfig(){loadConfig();toast("已重新加载");}

/* ---------- 模型 ---------- */
async function loadModels(){
  const d=await api("/v1/models");
  if(!d)return;
  const list=d.data||[];
  document.getElementById("modelCount").textContent="· "+list.length+" 个";
  document.getElementById("modelsBox").innerHTML=list.map(m=>`
    <span class="model-tag"><b>${esc(m.id)}</b><br><span class="ctx">${esc(m.owned_by||"CaMeL")} · ctx ${m.context_window?m.context_window.toLocaleString():"?"}</span></span>`).join("")||'<div class="empty">暂无模型</div>';
}
async function refreshModels(){toast("正在刷新模型缓存…");const d=await api("/admin/refresh-models","POST");if(d){toast("模型已刷新");loadModels();loadDashboard();}}

/* ---------- 日志 ---------- */
function startLogs(){
  if(logTimer)return;
  const tick=async()=>{
    if(logPaused)return;
    const d=await api("/admin/logs");
    if(!d)return;
    const box=document.getElementById("logsBox");
    const html=(d.logs||[]).map(l=>{
      const cls=/\bWARNING\b/.test(l)?"lwarn":/\bERROR\b/.test(l)?"lerr":"";
      return `<div class="${cls}">${esc(l)}</div>`;
    }).join("");
    box.innerHTML=html;
    box.scrollTop=box.scrollHeight;
  };
  tick();
  logTimer=setInterval(tick,3000);
}
function toggleLogPause(){
  logPaused=!logPaused;
  document.getElementById("logPauseBtn").textContent=logPaused?"▶ 继续":"⏸ 暂停";
}
function clearLogs(){document.getElementById("logsBox").innerHTML='<div class="empty">已清屏</div>';}

/* ---------- 初始化 ---------- */
if(PWD){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("app").classList.remove("hidden");showTab("dashboard");}
document.getElementById("pwd").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
</script>
</body>
</html>
